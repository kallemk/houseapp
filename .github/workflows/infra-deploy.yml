name: infra-deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-deploy.yml"
  pull_request:
    paths:
      - "infra/**"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Values are passed to az via env rather than interpolated straight into the command line, so
    # secrets never appear in a rendered command. GOOGLE_CLIENT_ID accepts a variable or a secret:
    # it belongs in a variable (it's public), but frontend-ci-cd tolerates both and these two must
    # agree — the backend validates the token's audience against exactly this value.
    env:
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      SEED_USER_1: ${{ secrets.SEED_USER_1 }}
      SEED_USER_2: ${{ secrets.SEED_USER_2 }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      # Secret only, never a variable, unlike GOOGLE_CLIENT_ID above — this one is a real credential.
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep build (lint/type-check)
        run: az bicep build --file infra/main.bicep

      - name: Check Google credentials are available
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_CLIENT_ID is empty — Authentication__Google__ClientId will be blank and Google sign-in will return 503. Set it as a repo variable (Settings → Secrets and variables → Actions → Variables)."
          else
            echo "Google client ID is set (${#GOOGLE_CLIENT_ID} chars)."
          fi
          # Only Drive needs this; sign-in works without it, so an empty value is a warning rather
          # than a failure.
          if [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::warning::GOOGLE_CLIENT_SECRET is empty — connecting Google Drive will return 503. Set it as a repo *secret*, not a variable."
          else
            echo "Google client secret is set (${#GOOGLE_CLIENT_SECRET} chars)."
          fi

      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters seedUser1="$SEED_USER_1" seedUser2="$SEED_USER_2" googleClientId="$GOOGLE_CLIENT_ID" googleClientSecret="$GOOGLE_CLIENT_SECRET"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production # requires manual approval — configure this as a protected environment in repo settings
    env:
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      SEED_USER_1: ${{ secrets.SEED_USER_1 }}
      SEED_USER_2: ${{ secrets.SEED_USER_2 }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      # Secret only, never a variable, unlike GOOGLE_CLIENT_ID above — this one is a real credential.
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters seedUser1="$SEED_USER_1" seedUser2="$SEED_USER_2" googleClientId="$GOOGLE_CLIENT_ID" googleClientSecret="$GOOGLE_CLIENT_SECRET"

      # Reads back what actually landed on the App Service, rather than trusting that the
      # parameter made it through — this whole class of bug was a value silently arriving empty.
      - name: Verify the client ID reached the App Service
        run: |
          SETTING=$(az webapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "${{ secrets.AZURE_APP_SERVICE_NAME }}" \
            --query "[?name=='Authentication__Google__ClientId'].value | [0]" -o tsv)
          if [ -z "$SETTING" ]; then
            echo "::warning::Authentication__Google__ClientId is empty on the App Service — Google sign-in will return 503."
          else
            echo "App Service has the Google client ID set (${#SETTING} chars)."
          fi
