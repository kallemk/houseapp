name: frontend-ci-cd

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Job level, not workflow level: the secrets context isn't available in workflow-level env.
    # The client ID is public by design (it ships inside the JS bundle), so a repo *variable* is
    # its intended home — the secret fallback just makes this work either way.
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Build here rather than letting the Static Web Apps action do it. Its build runs inside an
      # Oryx Docker container, which step-level env vars don't reliably reach — that silently
      # produced a bundle with no Google client ID, so the sign-in button never rendered. Building
      # ourselves makes the env var deterministic and skips a redundant second build.
      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify Google client ID is present
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::warning::VITE_GOOGLE_CLIENT_ID is empty — the Google sign-in button will NOT render. Set the GOOGLE_CLIENT_ID repo variable (Settings → Secrets and variables → Actions → Variables)."
          else
            echo "Google client ID is set (${#VITE_GOOGLE_CLIENT_ID} chars)."
          fi

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Confirm the client ID was inlined into the bundle
        run: |
          if grep -rq "apps.googleusercontent.com" frontend/dist/assets/*.js; then
            echo "Client ID found in the built bundle."
          else
            echo "::warning::No Google client ID found in the built bundle — the sign-in button will be hidden."
          fi

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # Already-built output; app_location points at it and output_location must be empty.
          app_location: "frontend/dist"
          output_location: ""
          skip_app_build: true
